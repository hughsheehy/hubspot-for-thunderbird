<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../popup/panel.css">
  <link rel="stylesheet" href="compose.css">
</head>
<body>
  <div id="app">

    <div id="state-loading" class="state">
      <p data-i18n="compose_loading"></p>
    </div>

    <div id="state-not-configured" class="state" hidden>
      <p data-i18n="compose_error_not_configured"></p>
      <button id="open-settings-btn" class="link-button" data-i18n="panel_error_not_configured_link"></button>
    </div>

    <div id="state-error" class="state" hidden>
      <h3 data-i18n="panel_error_heading"></h3>
      <p id="error-message" role="alert"></p>
    </div>

    <div id="state-ready" class="state" hidden>
      <h4 data-i18n="compose_heading"></h4>
      <div id="recipients-list"></div>
      <p id="no-recipients" class="status-line" data-i18n="compose_no_recipients" hidden></p>

      <button id="add-bcc-btn" class="primary" data-i18n="compose_add_bcc_button"></button>
      <p id="bcc-status" class="status-line" aria-live="polite"></p>
    </div>

  </div>

  <script src="../popup/common.js"></script>
  <script src="compose.js"></script>
</body>
</html>
