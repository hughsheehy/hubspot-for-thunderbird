<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="app">

    <div id="state-loading" class="state">
      <p data-i18n="panel_loading"></p>
    </div>

    <div id="state-no-message" class="state" hidden>
      <p data-i18n="panel_no_open_message"></p>
    </div>

    <div id="state-not-configured" class="state" hidden>
      <p data-i18n="panel_error_not_configured"></p>
      <button id="open-settings-btn" class="link-button" data-i18n="panel_error_not_configured_link"></button>
    </div>

    <div id="state-never-log" class="state" hidden>
      <p data-i18n="panel_never_log_note"></p>
    </div>

    <div id="state-error" class="state" hidden>
      <h3 data-i18n="panel_error_heading"></h3>
      <p id="error-message"></p>
    </div>

    <div id="state-not-found" class="state" hidden>
      <p id="not-found-message"></p>
      <button id="create-contact-btn" class="primary" data-i18n="panel_create_contact_button"></button>
      <p id="create-contact-status" class="status-line"></p>
    </div>

    <div id="state-found" class="state" hidden>
      <div id="you-sent-note" class="note" hidden data-i18n="panel_you_sent_note"></div>

      <div class="contact-card">
        <div class="contact-header">
          <div class="contact-name" id="contact-name"></div>
          <a id="open-in-hubspot" class="pill-link" target="_blank" rel="noopener" data-i18n="panel_open_in_hubspot" hidden></a>
        </div>

        <dl class="contact-fields" id="contact-fields"></dl>
      </div>

      <div class="deals-section">
        <h4 data-i18n="panel_deals_heading"></h4>
        <div id="deals-list"></div>
      </div>

      <div class="activity-section">
        <h4 data-i18n="panel_history_heading"></h4>
        <div id="activity-list"></div>
      </div>

      <button id="log-button" class="primary" data-i18n="panel_log_button"></button>
      <p id="log-status" class="status-line"></p>
    </div>

  </div>

  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
